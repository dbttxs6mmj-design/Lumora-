# 引路人 Lumora — nginx 反向代理配置
# 安裝：sudo cp nginx-lumora.conf /etc/nginx/sites-available/lumora
#        sudo ln -sf /etc/nginx/sites-available/lumora /etc/nginx/sites-enabled/lumora
#        sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;   # 接受所有域名；或換成 lumora.139.59.228.58.sslip.io

    # 圖片 / 文件上傳最大 20MB（base64 約 1.3 倍，原圖 ~15MB 以內）
    client_max_body_size 20M;

    # 所有請求一律轉發給 uvicorn（含前端靜態檔案 + API）
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
